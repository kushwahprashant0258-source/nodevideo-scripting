<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Node Video Scripting</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#eee;font-family:system-ui,sans-serif}header{padding:9px;background:#1b1c20;display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,select{font-size:13px;padding:8px 10px;border:0;border-radius:6px;background:#34363d;color:#fff}button:active{background:#555}#file{max-width:220px}#editor{width:100%;height:43vh;background:#090a0c;color:#e8e8e8;border:0;border-top:1px solid #292b31;padding:12px;font:13px monospace;outline:0;resize:vertical}#status{padding:7px 10px;color:#aaa;border-bottom:1px solid #282a2f}.row{display:flex;gap:7px;padding:7px 10px;flex-wrap:wrap}.panel{padding:0 10px}.title{font-weight:600;color:#bbb;font-size:12px}.out{white-space:pre-wrap;font:12px monospace;background:#090a0c;padding:9px;max-height:22vh;overflow:auto;border-top:1px solid #292b31}.pill{padding:3px 6px;border-radius:5px;background:#2b2d33;color:#aaa;font-size:11px}
</style></head><body>
<header><input id="file" type="file" accept=".nv,application/json"><button onclick="runScript()">Run</button><button onclick="downloadProject()">Export .nv</button><button onclick="undo()">Undo</button><button onclick="redo()">Redo</button><select id="example" onchange="loadExample(this.value)"><option value="">Examples…</option><option value="inspect">Inspect layers</option><option value="opacity">Set opacity</option><option value="position">Set position</option><option value="keys">Add keyframe</option></select></header>
<div id="status">No project loaded.</div><div class="row"><span class="pill" id="mode">MODE: FILE ADAPTER</span><span class="pill" id="counts">Layers: 0 · Properties: 0 · Keyframes: 0</span></div>
<textarea id="editor">// Node Video scripting v7 — file + live runtime modes
// File-adapter mode works on .nv JSON. Live IL2CPP mode uses runtime-discovered methods when the native bridge is loaded.

findProperties("_position").forEach(p => {
  if (p.Params?.length >= 2) {
    setValue(p.Params[0], 100);
    setValue(p.Params[1], 100);
  }
});</textarea>
<div class="panel"><div class="title">CONSOLE</div><div id="log" class="out"></div></div>
<script>
let project=null,originalName="project.nv",undoStack=[],redoStack=[],snapshotLimit=30;
const $=id=>document.getElementById(id);

// v6 live AE-style object adapter.
// It intentionally uses runtime discovery rather than hard-coded native addresses.
const LiveObject = (handle,typeHint='Object') => ({
  handle, type:typeHint,
  call(method,args=[]){ const raw=NodeVideoNative.invokeJson(handle,method,JSON.stringify(args)); return liveDecode(raw); },
  call0(method){ return liveDecode(NodeVideoNative.invoke0(handle,method)); },
  describe(){ return JSON.parse(NodeVideoNative.describeHandle(handle)); },
  release(){ return NodeVideoNative.release(handle); }
});
function liveDecode(raw){
  if(typeof raw!=='string') return raw;
  if(raw.startsWith('HANDLE:')){
    const p=raw.split(':'); return LiveObject(Number(p[1]),p.slice(2).join(':')||'Object');
  }
  if(raw==='null') return null;
  if(raw==='true'||raw==='false') return raw==='true';
  if(/^[-+]?\\d+(\\.\\d+)?$/.test(raw)) return Number(raw);
  try{return JSON.parse(raw)}catch(_){return raw}
}
const liveApi = {
  mode(){return NodeVideoNative.getMode()},
  classes(){return JSON.parse(NodeVideoNative.listClasses())},
  describeClass(ns,name){return JSON.parse(NodeVideoNative.describeClass(ns,name))},
  static(ns,name,method,args=[]){return liveDecode(NodeVideoNative.invokeStaticJson(ns,name,method,JSON.stringify(args)))},
  object(handle,type){return LiveObject(Number(handle),type)},
  findRoot(){
    // Preferred path documented by the v4 investigation.
    let app=this.static('NodeVideo','App','get_Instance',[]);
    if(app && app.handle){
      let root=app.call0('get_Root');
      if(root && root.handle) return root;
    }
    // Fallback: inspect UIProjectManager without assuming it is the root.
    let ui=this.static('NodeVideo.UI','UIProjectManager','get_Instance',[]);
    return ui && ui.handle ? ui : null;
  },
  inspectRoot(){
    const r=this.findRoot(); return r ? r.describe() : {error:'live root not found'};
  }
};
// AE-style aliases. These are wrappers around verified runtime calls.
const appLive = {
  get mode(){return liveApi.mode()},
  get project(){
    const root=liveApi.findRoot();
    if(!root) return null;
    return {
      _root:root,
      root,
      get name(){return root.type},
      children(){
        return root.call0('GetAllChildren') || [];
      },
      node(){return root}
    };
  },
  static:liveApi.static,
  classes:liveApi.classes,
  describeClass:liveApi.describeClass,
  inspectRoot:liveApi.inspectRoot
};
function installLiveScripting(){
  try{
    if(typeof NodeVideoNative!=='undefined'){
      $('mode').textContent='MODE: '+NodeVideoNative.getMode().toUpperCase();
    }
  }catch(_){}
}
function log(x){$('log').textContent+=String(x)+"\n";$('log').scrollTop=$('log').scrollHeight}
function setStatus(x){$('status').textContent=x}
function clone(x){return JSON.parse(JSON.stringify(x))}
function savePoint(){if(!project)return;undoStack.push(clone(project));if(undoStack.length>snapshotLimit)undoStack.shift();redoStack=[];updateCounts()}
function undo(){if(!project||!undoStack.length)return;redoStack.push(clone(project));project=undoStack.pop();setStatus('Undo');updateCounts()}
function redo(){if(!project||!redoStack.length)return;undoStack.push(clone(project));project=redoStack.pop();setStatus('Redo');updateCounts()}
function walk(x,fn,path=[]){if(Array.isArray(x)){x.forEach((v,i)=>walk(v,fn,path.concat(i)));}else if(x&&typeof x==='object'){fn(x,path);Object.keys(x).forEach(k=>walk(x[k],fn,path.concat(k)));}}
function findProperties(name){const out=[];if(!project)return out;walk(project,(o,p)=>{if(o&&o.Name===name)out.push(o)});return out}
function findType(type){const out=[];if(!project)return out;walk(project,(o,p)=>{if(o&&o.$type===type)out.push(o)});return out}
function findLayers(){const out=[];if(!project)return out;walk(project,(o,p)=>{if(o&&typeof o.Name==='string'&&(o.ChildList!==undefined||o.MainMINI===true||o.Type!==undefined))out.push(o)});return [...new Set(out)]}
function findById(id){let r=null;walk(project,o=>{if(o&&o.$id===String(id))r=o});return r}
function getValue(p){return p&&Object.prototype.hasOwnProperty.call(p,'Value')?p.Value:undefined}
function setValue(p,v){if(!p)return false;savePoint();if('Value' in p)p.Value=v;else p.Value=v;updateCounts();return true}
function getKeyframes(p){if(!p)return[];return Array.isArray(p.KeyFrames)?p.KeyFrames:[]}
function addKeyframe(p,time,value){if(!p)return null;savePoint();if(!Array.isArray(p.KeyFrames))p.KeyFrames=[];const k={$id:'script-'+Date.now()+'-'+Math.random().toString(36).slice(2),Time:time,Value:value};p.KeyFrames.push(k);p.KeyFrames.sort((a,b)=>(a.Time??a.time??0)-(b.Time??b.time??0));updateCounts();return k}
function deleteKeyframes(p,predicate){if(!p||!Array.isArray(p.KeyFrames))return 0;savePoint();const before=p.KeyFrames.length;p.KeyFrames=p.KeyFrames.filter((k,i)=>!predicate(k,i));updateCounts();return before-p.KeyFrames.length}
function setAtTime(p,time,value){let ks=getKeyframes(p);if(!ks.length)return addKeyframe(p,time,value);let k=ks.find(x=>(x.Time??x.time)===time);if(k){savePoint();k.Value=value}else addKeyframe(p,time,value);return k}
function eachProperty(fn){if(!project)return;walk(project,(o)=>{if(o&&typeof o.Name==='string'&&('Value'in o||'KeyFrames'in o))fn(o)})}
function stats(){let layers=findLayers(),props=0,keys=0;eachProperty(p=>{props++;keys+=getKeyframes(p).length});return{layers:layers.length,properties:props,keyframes:keys}}
function updateCounts(){const s=stats();$('counts').textContent=`Layers: ${s.layers} · Properties: ${s.properties} · Keyframes: ${s.keyframes}`}
function loadExample(v){const ex={inspect:`log('Layers: '+findLayers().map(x=>x.Name).join(', '));`,opacity:`findProperties('opacity').forEach(p=>setValue(p,50));`,position:`findProperties('_position').forEach(p=>{if(p.Params?.length>=2){setValue(p.Params[0],100);setValue(p.Params[1],100)}});`,keys:`const p=findProperties('opacity')[0]; if(p) addKeyframe(p,0,0), addKeyframe(p,30,100);`};if(ex[v])$('editor').value=ex[v];this.value=''}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;originalName=f.name;const r=new FileReader();r.onload=()=>{try{project=JSON.parse(r.result);undoStack=[];redoStack=[];setStatus('Loaded '+f.name+' · ready');log('Project loaded.');updateCounts()}catch(err){log('JSON error: '+err);setStatus('Failed to load project.')}};r.readAsText(f)};
function runScript(){if(!project && !nativeMode){log('Load an .nv project first.');return}const code=$('editor').value;try{savePoint();new Function('project','app','findProperties','findType','findLayers','findById','getValue','setValue','getKeyframes','addKeyframe','deleteKeyframes','setAtTime','eachProperty','log',code)(project,app,findProperties,findType,findLayers,findById,getValue,setValue,getKeyframes,addKeyframe,deleteKeyframes,setAtTime,eachProperty,log);setStatus('Script executed successfully.');log('OK');updateCounts()}catch(e){setStatus('Script failed.');log('ERROR: '+(e?.stack||e))}}
const nativeMode=(()=>{try{return !!window.NodeVideoNative && NodeVideoNative.isLiveAvailable()}catch(e){return false}})();
const live={
available:nativeMode,
mode:()=>{try{return NodeVideoNative.getMode()}catch(e){return 'file-adapter'}},
findClass:(ns,name)=>NodeVideoNative.findClass(ns,name),
describeClass:(ns,name)=>{try{return JSON.parse(NodeVideoNative.describeClass(ns,name))}catch(e){return {error:String(e)}}},
invokeStatic:(ns,name,method,args=[])=>NodeVideoNative.invokeStaticJson(ns,name,method,JSON.stringify(args)),
invoke:(handle,method,args=[])=>NodeVideoNative.invokeJson(handle,method,JSON.stringify(args)),
handle:(x)=>{const m=String(x).match(/^HANDLE:(\d+):/);return m?Number(m[1]):null},
release:(handle)=>{try{return NodeVideoNative.release(handle)}catch(e){return false}},
callStatic:(ns,clazz,method,...args)=>NodeVideoNative.invokeStaticJson(ns,clazz,method,JSON.stringify(args.map(a=>typeof a==='string'?'string:'+a:typeof a==='number'?(Number.isInteger(a)?'int:'+a:'double:'+a):typeof a==='boolean'?'bool:'+(a?'true':'false'):'handle:'+a))),
call:(handle,method,...args)=>NodeVideoNative.invokeJson(handle,method,JSON.stringify(args.map(a=>typeof a==='string'?'string:'+a:typeof a==='number'?(Number.isInteger(a)?'int:'+a:'double:'+a):typeof a==='boolean'?'bool:'+(a?'true':'false'):'handle:'+a))),
root:()=>live.handle(live.callStatic('NodeVideo','App','get_Instance')),
rootNode:()=>{const apph=live.root();return apph?live.handle(live.call(apph,'get_Root')):null},
get:(handle,method,...args)=>{const r=live.call(handle,method,...args);return live.handle(r)||r},
getCount:(handle)=>{const r=live.call(handle,'get_Count');return Number(r)},
getItem:(handle,index)=>live.handle(live.call(handle,'get_Item',index)),
getProp:(node,name)=>live.handle(live.call(node,'GetProp',name)),
getEffect:(node,name)=>live.handle(live.call(node,'GetEffect',name)),
children:(node)=>{const r=live.call(node,'GetAllChildren');return live.handle(r)||null},
childrenArray:(node,max=1000)=>{const list=live.children(node);if(!list)return[];const n=Math.min(live.getCount(list),max),a=[];for(let i=0;i<n;i++){const h=live.getItem(list,i);if(h)a.push(h)}return a},
propValue:(prop)=>live.get(prop,'get_Value'),
setParam:(prop,value)=>live.call(prop,'Set',value),
addKey:(param,time,value)=>live.call(param,'AddKeyFrame',time,value),
keyframes:(param)=>{const r=live.call(param,'GetKeyFrames');return live.handle(r)||r},
info:(handle)=>handle?live.call(handle,'ToString'):'null'
};
const liveProject={get root(){return live.rootNode()},children:live.childrenArray,prop:live.getProp,effect:live.getEffect};
const app={version:'7.7.1-script-v7',mode:nativeMode?'live-runtime':'file-adapter',project:{get root(){return project},get liveRoot(){return liveProject.root},findProperties,findLayers,findType,live:liveProject},live,undo,redo};
if(nativeMode){$('mode').textContent='MODE: LIVE IL2CPP';log('Live IL2CPP runtime bridge detected. Use app.live to discover/invoke runtime objects.')}
function inspectLiveClass(ns,name){if(!nativeMode){log('Live bridge unavailable.');return null}const d=live.describeClass(ns,name);log(JSON.stringify(d,null,2));return d}
function inspectLiveRoot(){const h=live.rootNode();if(!h){log('Live root unavailable: '+live.callStatic('NodeVideo','App','get_Instance'));return null}log('Live root handle: '+h+'\\n'+live.info(h));return h}
function scriptingSelfTest(){
  const out={mode:NodeVideoNative.getMode(),native:NodeVideoNative.isLiveAvailable(),root:null};
  if(out.native){try{const r=liveApi.findRoot();out.root=r?r.describe():null;}catch(e){out.error=String(e)}}
  log(JSON.stringify(out,null,2)); return out;
}
function downloadProject(){if(!project){log('Nothing to export.');return}const blob=new Blob([JSON.stringify(project)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=originalName.replace(/\.nv$/i,'')+'_scripted.nv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
updateCounts();
window.addEventListener('load',installLiveScripting);
</script></body></html>
