name: Build Node Video Scripting APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          chmod +x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Verify Android toolchain
        shell: bash
        run: |
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"

      - name: Build real Node Video APK
        shell: bash
        run: |
          chmod +x scripts/build_apk.sh scripts/zip_native.py scripts/make_stable_ids.py
          gradle --no-daemon --console=plain buildRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s build/apk/NodeVideo-Scripting-v7.7.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/apk/NodeVideo-Scripting-v7.7.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NodeVideo-Scripting-v7.7.1
          path: build/apk/NodeVideo-Scripting-v7.7.1.apk
